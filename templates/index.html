<!DOCTYPE html>
<html>
<head>
    <title>VentureLink</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">VentureLink</span>
</nav>

<div class="container mt-4">

    <h2 class="mb-3">Startups</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>City</th>
                <th>Stage</th>
                <th>Valuation</th>
            </tr>
        </thead>

        <tbody>
            {% for s in startups %}
            <tr>
                <td>{{ s[0] }}</td>
                <td>{{ s[1] }}</td>
                <td>{{ s[2] }}</td>
                <td>{{ s[3] }}</td>
                <td>{{ s[4] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <hr>

    <h3>Add Startup</h3>

    <form method="POST" action="/add" class="row g-3">
        <div class="col-md-3">
            <input type="text" name="name" class="form-control" placeholder="Name">
        </div>
        <div class="col-md-3">
            <input type="text" name="city" class="form-control" placeholder="City">
        </div>
        <div class="col-md-3">
            <input type="text" name="stage" class="form-control" placeholder="Stage">
        </div>
        <div class="col-md-3">
            <input type="number" name="valuation" class="form-control" placeholder="Valuation">
        </div>

        <div class="col-12">
            <button class="btn btn-primary">Add Startup</button>
        </div>
    </form>

</div>

</body>
</html>
