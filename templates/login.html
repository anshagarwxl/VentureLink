<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VentureLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f23;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
        }
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 2rem;
            color: white;
        }
        .brand h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .brand p {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }
        .form-label {
            color: rgba(255,255,255,0.8);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .form-control, .form-select {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.12);
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
            outline: none;
            color: white;
        }
        .form-control::placeholder {
            color: rgba(255,255,255,0.4);
        }
        .form-select option {
            background: #1a1a2e;
            color: white;
        }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider span {
            padding: 0 15px;
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
        }
        .quick-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .quick-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .quick-btn.startup {
            background: rgba(16,185,129,0.15);
            color: #10b981;
        }
        .quick-btn.startup:hover {
            background: rgba(16,185,129,0.3);
            transform: translateY(-2px);
        }
        .quick-btn.investor {
            background: rgba(59,130,246,0.15);
            color: #3b82f6;
        }
        .quick-btn.investor:hover {
            background: rgba(59,130,246,0.3);
            transform: translateY(-2px);
        }
        .startup-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .startup-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fas fa-rocket"></i>
                </div>
                <h1>VentureLink</h1>
                <p>Connect. Innovate. Grow.</p>
            </div>

            <form method="POST" id="loginForm">
                <div class="mb-3">
                    <label class="form-label">I am a...</label>
                    <select class="form-select" name="role" id="roleSelect" onchange="toggleRole()" required>
                        <option value="" selected>Select your role</option>
                        <option value="startup">🚀 Startup Founder</option>
                        <option value="investor">💰 Investor</option>
                    </select>
                </div>

                <!-- Startup fields -->
                <div id="startupFields" class="startup-section">
                    <div class="mb-3">
                        <label class="form-label">Select Your Startup</label>
                        <select class="form-select" name="startup_id" id="startupSelect">
                            <option value="">Choose startup...</option>
                            {% for s in startups %}
                            <option value="{{ s.startup_id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted" style="color: rgba(255,255,255,0.5) !important;">Select the startup you represent</small>
                    </div>
                </div>

                <!-- Investor fields - simplified (no password) -->
                <div id="investorFields" class="startup-section">
                    <div class="mb-3">
                        <label class="form-label">Your Name (for demo)</label>
                        <input type="text" class="form-control" name="investor_name" placeholder="Enter your name">
                    </div>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Continue
                </button>
            </form>

            <div class="divider">
                <span>NEW?</span>
            </div>

            <div class="quick-login">
                <a href="/signup" class="quick-btn startup">
                    <i class="fas fa-plus"></i>Startup
                </a>
                <a href="/signup_investor" class="quick-btn investor">
                    <i class="fas fa-user-plus"></i>Investor
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggleRole() {
            const role = document.getElementById('roleSelect').value;
            const startupFields = document.getElementById('startupFields');
            const investorFields = document.getElementById('investorFields');
            const startupSelect = document.getElementById('startupSelect');
            
            if (role === 'startup') {
                startupFields.classList.add('active');
                investorFields.classList.remove('active');
                startupSelect.setAttribute('required', 'required');
            } else if (role === 'investor') {
                investorFields.classList.add('active');
                startupFields.classList.remove('active');
                startupSelect.removeAttribute('required');
            } else {
                startupFields.classList.remove('active');
                investorFields.classList.remove('active');
            }
        }
    </script>
</body>
</html>
