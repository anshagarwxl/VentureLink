<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Startup - VentureLink</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .signup-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 40px 0;
        }
        .signup-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
        }
        .signup-header {
            background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
            padding: 40px 30px;
            text-align: center;
        }
        .signup-header h1 {
            color: white;
            font-weight: 700;
            margin: 0;
        }
        .signup-header p {
            color: #9ca3af;
            margin-top: 10px;
        }
        .signup-body {
            padding: 40px 30px;
        }
        .form-label {
            font-weight: 600;
            color: #374151;
        }
        .form-select, .form-control {
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 15px;
        }
        .form-select:focus, .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        .btn-signup {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 10px;
            padding: 14px 30px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: transform 0.2s;
        }
        .btn-signup:hover {
            transform: translateY(-2px);
            color: white;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #6b7280;
            text-decoration: none;
        }
        .back-link a:hover {
            color: #10b981;
        }
    </style>
</head>
<body class="signup-page">
    <div class="signup-card">
        <div class="signup-header">
            <i class="fas fa-rocket role-icon" style="font-size: 3rem; color: white; margin-bottom: 15px;"></i>
            <h1>Register Startup</h1>
            <p>Create your startup profile on VentureLink</p>
        </div>
        <div class="signup-body">
            <form method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">
                        <i class="fas fa-building me-2"></i>Startup Name
                    </label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter startup name" required>
                </div>
                
                <div class="mb-3">
                    <label for="city" class="form-label">
                        <i class="fas fa-map-marker-alt me-2"></i>City
                    </label>
                    <input type="text" class="form-control" id="city" name="city" placeholder="Enter city" required>
                </div>
                
                <div class="mb-3">
                    <label for="stage" class="form-label">
                        <i class="fas fa-layer-group me-2"></i>Stage
                    </label>
                    <select class="form-select" id="stage" name="stage" required>
                        <option value="">Select Stage</option>
                        <option value="Seed">Seed</option>
                        <option value="Series A">Series A</option>
                        <option value="Series B">Series B</option>
                        <option value="Series C">Series C</option>
                        <option value="IPO">IPO</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label for="valuation" class="form-label">
                        <i class="fas fa-dollar-sign me-2"></i>Valuation ($)
                    </label>
                    <input type="number" class="form-control" id="valuation" name="valuation" placeholder="Enter valuation amount" required>
                </div>
                
                <button type="submit" class="btn btn-signup">
                    <i class="fas fa-rocket me-2"></i>Register Startup
                </button>
            </form>
            
            <div class="back-link">
                <a href="/">
                    <i class="fas fa-arrow-left me-1"></i>Back to Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
